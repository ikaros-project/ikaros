name: Linux

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Ubuntu 24.04 / GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libjpeg-turbo8-dev \
            liblapack-dev \
            libopenblas-dev \
            libpng-dev \
            libssl-dev \
            libtiff-dev \
            libwebp-dev

      - name: Configure
        run: cmake -S . -B Build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build Build --parallel 2

      - name: Run kernel test suite
        run: |
          python3 Source/Kernel/UnitTesting/KernelTests/kernel_test.py \
            --ikaros Bin/ikaros \
            --jobs 2

      - name: Smoke-test WebUI
        run: python3 Scripts/ci_webui_smoke.py --ikaros Bin/ikaros
